name: auto-sync-upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup git identity and remotes
        run: |
          set -euo pipefail
          git config user.name "wechat-avatar-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Real upstream (original plugin). origin is this fork.
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/SXP-Simon/astrbot_plugin_qq_group_daily_analysis.git
          git fetch upstream main
          git fetch origin

      - name: Merge upstream into fork branches
        run: |
          set -euo pipefail

          merge_branch() {
            local branch="$1"
            local snapshot="/tmp/${branch}-workflows"

            git checkout -B "$branch" "origin/$branch"

            rm -rf "$snapshot"
            mkdir -p "$snapshot"
            cp -a .github/workflows "$snapshot/workflows"

            if ! git merge --no-commit --no-ff upstream/main; then
              git status --short || true
              git merge --abort || true
              echo "::error::Merge conflict while syncing ${branch}"
              exit 1
            fi

            rm -rf .github/workflows
            mkdir -p .github
            cp -a "$snapshot/workflows" .github/workflows
            git add .github/workflows

            if ! git diff --cached --quiet; then
              git commit -m "chore(sync): merge upstream/main into ${branch}"
            fi

            git push origin "$branch"
          }

          merge_branch main
          merge_branch wechat-avatar

      - name: Purge jsDelivr branch alias (best-effort)
        if: success()
        run: |
          set -euo pipefail
          # Branch alias can lag; commit-pinned URLs are primary. Purge helps HTML that still uses @wechat-avatar.
          base="https://purge.jsdelivr.net/gh/muqing-kg/astrbot_plugin_qq_group_daily_analysis@wechat-avatar/assets/custom/jx3_qban"
          for path in \
            "icons/emoji_01.webp" \
            "icons/emoji_02.webp" \
            "header_bg.jpg" \
            "hero.webp" \
            "deco.webp" \
            "peak.webp"
          do
            curl -fsS "${base}/${path}" || true
          done
          curl -fsS "${base}/icons/emoji_01.webp" || true
          echo "purge attempted"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Auto sync"
            echo "- strategy: merge upstream/main, preserve fork history"
            echo "- main and wechat-avatar keep their own workflow files"
            echo "- conflicts stop the run instead of resetting fork commits"
            echo "- origin: https://github.com/muqing-kg/astrbot_plugin_qq_group_daily_analysis"
            echo "- upstream: https://github.com/SXP-Simon/astrbot_plugin_qq_group_daily_analysis"
            git log --oneline -2 main || true
            git log --oneline -2 wechat-avatar || true
          } >> "$GITHUB_STEP_SUMMARY"
