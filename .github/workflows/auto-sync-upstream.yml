name: auto-sync-upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup git identity and remotes
        run: |
          set -euo pipefail
          git config user.name "wechat-avatar-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Real upstream (original plugin). origin is this fork.
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/SXP-Simon/astrbot_plugin_qq_group_daily_analysis.git
          git fetch upstream --tags
          git fetch origin

      - name: Snapshot maintenance files
        run: |
          set -euo pipefail
          mkdir -p /tmp/wb-maint/.github/workflows /tmp/wb-maint/scripts
          cp .github/workflows/auto-sync-upstream.yml /tmp/wb-maint/.github/workflows/auto-sync-upstream.yml
          cp scripts/apply_wechat_avatar_patch.py /tmp/wb-maint/scripts/apply_wechat_avatar_patch.py
          cp scripts/apply_soft_glass_template.py /tmp/wb-maint/scripts/apply_soft_glass_template.py
          cp scripts/apply_fork_branding.py /tmp/wb-maint/scripts/apply_fork_branding.py
          cp scripts/apply_jx3_qban_template.py /tmp/wb-maint/scripts/apply_jx3_qban_template.py
          cp scripts/apply_t2i_resilience.py /tmp/wb-maint/scripts/apply_t2i_resilience.py
          cp scripts/refill_jx3_emojis.py /tmp/wb-maint/scripts/refill_jx3_emojis.py
          cp WECHATBRIDGE.md /tmp/wb-maint/WECHATBRIDGE.md
          mkdir -p /tmp/wb-maint/assets/custom/templates
          cp assets/custom/soft_glass_character.jpg /tmp/wb-maint/assets/custom/soft_glass_character.jpg
          cp -a assets/custom/templates/soft_glass /tmp/wb-maint/assets/custom/templates/soft_glass
          cp -a assets/custom/jx3_qban /tmp/wb-maint/assets/custom/jx3_qban
          if [ -d assets/custom/templates/jx3_qban ]; then cp -a assets/custom/templates/jx3_qban /tmp/wb-maint/assets/custom/templates/jx3_qban; fi
          # optional local ignore rules
          if [ -f .gitignore ]; then
            cp .gitignore /tmp/wb-maint/.gitignore
          fi

      - name: Restore maintenance tree helper
        id: restore_helper
        run: |
          set -euo pipefail
          cat > /tmp/wb-restore-maint.sh <<'EOS'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p .github/workflows scripts assets/custom/templates
          cp /tmp/wb-maint/.github/workflows/auto-sync-upstream.yml .github/workflows/auto-sync-upstream.yml
          cp /tmp/wb-maint/scripts/apply_wechat_avatar_patch.py scripts/apply_wechat_avatar_patch.py
          cp /tmp/wb-maint/scripts/apply_soft_glass_template.py scripts/apply_soft_glass_template.py
          cp /tmp/wb-maint/scripts/apply_fork_branding.py scripts/apply_fork_branding.py
          cp /tmp/wb-maint/scripts/apply_jx3_qban_template.py scripts/apply_jx3_qban_template.py
          cp /tmp/wb-maint/scripts/apply_t2i_resilience.py scripts/apply_t2i_resilience.py
          cp /tmp/wb-maint/scripts/refill_jx3_emojis.py scripts/refill_jx3_emojis.py
          cp /tmp/wb-maint/WECHATBRIDGE.md WECHATBRIDGE.md
          cp /tmp/wb-maint/assets/custom/soft_glass_character.jpg assets/custom/soft_glass_character.jpg
          cp -a /tmp/wb-maint/assets/custom/templates/soft_glass assets/custom/templates/soft_glass
          cp -a /tmp/wb-maint/assets/custom/jx3_qban assets/custom/jx3_qban
          if [ -d /tmp/wb-maint/assets/custom/templates/jx3_qban ]; then
            mkdir -p assets/custom/templates
            cp -a /tmp/wb-maint/assets/custom/templates/jx3_qban assets/custom/templates/jx3_qban
          fi
          if [ -f /tmp/wb-maint/.gitignore ]; then
            cp /tmp/wb-maint/.gitignore .gitignore
          fi
          EOS
          chmod +x /tmp/wb-restore-maint.sh

      - name: Rebuild main = upstream + maintenance + branding
        run: |
          set -euo pipefail
          git checkout -B main
          git reset --hard upstream/main
          bash /tmp/wb-restore-maint.sh
          # Order: templates first, then t2i defaults/schema, then branding
          python3 scripts/apply_soft_glass_template.py
          python3 scripts/apply_jx3_qban_template.py
          python3 scripts/apply_t2i_resilience.py
          python3 scripts/apply_fork_branding.py
          git add -A
          if git diff --cached --quiet; then
            echo "main already current"
          else
            git commit -m "chore(maint): upstream mirror + soft_glass + jx3_qban + t2i + fork branding"
          fi
          # Second commit: pin jx3 CDN to the previous SHA (assets live there; amend would change SHA)
          if git rev-parse --verify HEAD >/dev/null 2>&1; then
            export JX3_QBAN_CDN_REF="$(git rev-parse HEAD)"
            python3 scripts/apply_jx3_qban_template.py
            python3 scripts/apply_fork_branding.py
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore(jx3): pin CDN to ${JX3_QBAN_CDN_REF:0:12}"
            fi
          fi
          git push origin main --force-with-lease

      - name: Rebuild wechat-avatar = upstream + patches + branding
        run: |
          set -euo pipefail
          git checkout -B wechat-avatar
          git reset --hard upstream/main
          bash /tmp/wb-restore-maint.sh
          python3 scripts/apply_wechat_avatar_patch.py
          python3 scripts/apply_soft_glass_template.py
          # First build uses branch CDN (safe while HEAD is still upstream)
          python3 scripts/apply_jx3_qban_template.py
          python3 scripts/apply_t2i_resilience.py
          python3 scripts/apply_fork_branding.py
          git add -A
          if git diff --cached --quiet; then
            echo "no changes after patch" >&2
            exit 1
          fi
          git commit -m "fix(onebot): WeChatBridge avatar + soft_glass + jx3_qban + t2i + fork branding"
          # Pin CDN to the commit that actually contains assets (parent of this pin commit)
          export JX3_QBAN_CDN_REF="$(git rev-parse HEAD)"
          python3 scripts/apply_jx3_qban_template.py
          python3 scripts/apply_fork_branding.py
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(jx3): pin CDN to ${JX3_QBAN_CDN_REF:0:12}"
          fi
          git push origin wechat-avatar --force-with-lease

      - name: Purge jsDelivr branch alias (best-effort)
        if: success()
        run: |
          set -euo pipefail
          # Branch alias can lag; commit-pinned URLs are primary. Purge helps HTML that still uses @wechat-avatar.
          base="https://purge.jsdelivr.net/gh/muqing-kg/astrbot_plugin_qq_group_daily_analysis@wechat-avatar/assets/custom/jx3_qban"
          for path in \
            "icons/emoji_01.webp" \
            "icons/emoji_02.webp" \
            "header_bg.jpg" \
            "hero.webp" \
            "deco.webp" \
            "peak.webp"
          do
            curl -fsS "${base}/${path}" || true
          done
          curl -fsS "https://purge.jsdelivr.net/gh/muqing-kg/astrbot_plugin_qq_group_daily_analysis@wechat-avatar/assets/custom/jx3_qban/icons/emoji_01.webp" || true
          echo "purge attempted"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Auto sync"
            echo "- strategy: reset to upstream/main then reapply patches (no merge conflicts)"
            echo "- main: upstream + soft_glass + jx3_qban + t2i + fork branding"
            echo "- wechat-avatar: upstream + avatar + soft_glass + jx3_qban + t2i + fork branding"
            echo "- maintenance sources snapshotted then restored (scripts + assets/custom)"
            echo "- jx3 CDN pinned to post-commit SHA after rebuild"
            echo "- origin: https://github.com/muqing-kg/astrbot_plugin_qq_group_daily_analysis"
            echo "- upstream: https://github.com/SXP-Simon/astrbot_plugin_qq_group_daily_analysis"
            git log --oneline -2 main || true
            git log --oneline -2 wechat-avatar || true
          } >> "$GITHUB_STEP_SUMMARY"
